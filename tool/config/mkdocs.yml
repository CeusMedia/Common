site_name: CeusMedia Common
site_description: PHP library with 400+ classes for everyday tasks - file system, network and HTTP, CLI, UI and images, XML, data structures and algorithms.
site_author: Christian Würker
repo_url: https://github.com/CeusMedia/Common
repo_name: CeusMedia/Common
edit_uri: ""
copyright: Copyright &copy; 2007-2026 Christian Würker &middot; GPL-3.0-or-later

docs_dir: ../../doc/Manual
site_dir: ../../doc/Site
use_directory_urls: false

theme:
  name: material
  language: en
  icon:
    logo: material/toolbox-outline
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Fira Sans
    code: Fira Code
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/theme-light-dark
        name: "Theme: system – switch to light"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: "Theme: light – switch to dark"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: "Theme: dark – switch to system"
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - assets/extra.css

plugins:
  - search
  - offline

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CeusMedia/Common
    - icon: simple/packagist
      link: https://packagist.org/packages/ceus-media/common

